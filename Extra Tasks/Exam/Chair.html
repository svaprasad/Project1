<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Home</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width" />
    <link
      rel="stylesheet"
      href="https://unicons.iconscout.com/release/v2.1.9/css/unicons.css"  
    />     <!----cart icon---->
    
    <link rel="stylesheet" href="./Chair.css" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">   <!---poppins font family--->  

  </head>
  <body>
    <div class="section-fluid-main">
      <div class="section">
        <div class="info-wrap mob-margin">
          <div class="ch1">
            <img src="./Assets/chair/ch2.webp" alt="image" />
          </div>
          <p class="title">Modern chair</p>
          <h2>Sella Gastro</h2>
          <h4>$174 <span>$237</span></h4>
          <div class="section-fluid">
            <input class="desc-btn" type="radio" id="desc-1" name="desc-btn" checked
            />
            <label for="desc-1">Description</label>
            <input class="desc-btn" type="radio" id="desc-2" name="desc-btn" />
            <label for="desc-2">Details</label>
            <div class="section-fluid desc-sec accor-1">
              <p>
                The chair construction is made of ash tree. Upholstery and wood
                color at customer's request.
              </p>
            </div>
            <div class="section-fluid desc-sec accor-2">
              <div class="section-inline">
                <p><span>76</span>cm<br />Lenght</p>
              </div>
              <div class="section-inline">
                <p><span>68</span>cm<br />Width</p>
              </div>
              <div class="section-inline">
                <p><span>87</span>cm<br />Height</p>
              </div>
              <div class="section-inline">
                <p><span>10</span>kg<br />Weight</p>
              </div>
            </div>
          </div>
          <h5>Choose upholstery:</h5>
        </div>
        <div class="clearfix"></div>
        <input
          class="color-btn for-color-1"
          type="radio"
          id="color-1"
          name="color-btn"
          checked
        />
        <label class="first-color" for="color-1"></label>
        <input
          class="color-btn for-color-2"
          type="radio"
          id="color-2"
          name="color-btn"
        />
        <label class="color-2" for="color-2"></label>
        <input
          class="color-btn for-color-3"
          type="radio"
          id="color-3"
          name="color-btn"
        />
        <label class="color-3" for="color-3"></label>
        <input
          class="color-btn for-color-4"
          type="radio"
          id="color-4"
          name="color-btn"
        />
        <label class="color-4" for="color-4"></label>
        <input
          class="color-btn for-color-5"
          type="radio"
          id="color-5"
          name="color-btn"
        />
        <label class="color-5" for="color-5"></label>
        <input
         class="color-btn for-color-6"
          type="radio"
          id="color-6"
          name="color-btn"
        />
        <label class="color-6" for="color-6"></label>
        <div class="clearfix"></div>
        <div class="info-wrap">
          <a href="#" class="btn"
            ><i class="uil uil-shopping-cart icon"></i> Add To Cart</a
          >
        </div>
        <div class="back-color"></div>
        <div class="back-color chair-2"></div>
        <div class="back-color chair-3"></div>
        <div class="back-color chair-4"></div>
        <div class="back-color chair-5"></div>
        <div class="back-color chair-6"></div>
      </div>
    </div>
  </body>
</html>
