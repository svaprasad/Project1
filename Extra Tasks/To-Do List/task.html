<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <title>Employee Registration</title>

  <style>
    body {
      background: linear-gradient(to right, #240b36, #c31432);
      color: #f5f5f5;
      font-family: Arial;
    }

    .dark-mode {
      background: black !important;
      color: white !important;
    }

    h1 {
      text-align: center;
      font-weight: bold;
      color: #ffeaea;
    }

    .form-container {
      width: 350px;
      margin: auto;
      background: rgba(255,255,255,0.15);
      padding: 20px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .input {
      width: 80%;
      margin-left: 10%;
      padding: 12px 20px;
      border-radius: 50px;
      margin-top: 15px;
      border: 1px solid #ffffff55;

      /* NEW INPUT COLORS */
      background-color: white;
      color: black;
      font-size: 16px;
    }

    .input::placeholder {
      color: #555;
    }

    .btn1 {
      color: white;
      background-color: #d64848;
      border-radius: 50px;
      padding: 8px 20px;
      font-size: 18px;
      margin-left: 35%;
      margin-top: 10px;
      cursor: pointer;
      border: none;
    }

 

    .dark-mode .btn1 {
        background-color: #56396b;
        color: white;
    }

    table {
      margin: 30px auto;
      width: 80%;
      border-collapse: collapse;
      background: rgba(157, 64, 64, 0.25);
      border-radius: 10px;
      overflow: hidden;
      color: white;
    }

    th, td {
      padding: 12px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }

    th {
      background: #90262f;
      color: #fff;
    }

    .editBtn, .delBtn {
      border: none;
      border-radius: 50px;
      font-size: 18px;
      padding: 8px;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.5);
    }

 
    .delBtn:hover {
      background: #e74c3c;
      color: white;
    }

    .btn {
      position: absolute;
      top: 20px;
      left: 360px;
      
    }

    .btn button {
      border-radius: 50%;
      padding: 10px;
      font-size: 18px;
      cursor: pointer;
      background-color: #6e6666;
      border: none;
    }
    
    .dark-mode .btn button {
        background-color: white;
    }

    h2 {
      text-align: center;
      color: #222;
      font-weight: bold;
    }

    .dark-mode h2 {
      color: white;
    }
  </style>
</head>

<body>

  <h1>Office Employee Registration</h1>

  <div class="btn">
    <button onclick="toggleMode()">
      <i class="fa-solid fa-moon"></i>
    </button>
  </div>

  <div class="form-container">
    <form id="empForm">
      <h2>Employee Details</h2>

      <input id="taskInput" class="input" type="text" placeholder="Employee Name">
      <input id="taskInput1" class="input" type="email" placeholder="Employee Email">
      <input id="taskInput2" class="input" type="text" placeholder="Employee Contact No.">
      <input id="taskInput3" class="input" type="text" placeholder="Employee Age"><br><br>

      <button id="addBtn" class="btn1">Register</button>
    </form>
  </div>

  <table id="empTable">
    <thead>
      <tr>
        <th>Name</th>
        <th>Email</th>
        <th>Contact</th>
        <th>Age</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

<script>
  function toggleMode() {
    document.body.classList.toggle("dark-mode");
  }

  let nameInput = document.querySelector("#taskInput");
  let emailInput = document.querySelector("#taskInput1");
  let contactInput = document.querySelector("#taskInput2");
  let ageInput = document.querySelector("#taskInput3");
  let addBtn = document.querySelector("#addBtn");
  let tableBody = document.querySelector("#empTable tbody");

  addBtn.addEventListener("click", function (e) {
    e.preventDefault();

    let name = nameInput.value.trim();
    let email = emailInput.value.trim();
    let contact = contactInput.value.trim();
    let age = ageInput.value.trim();

    if (!name || !email || !contact || !age) {
      alert("Please fill all inputs");
      return;
    }

    let row = document.createElement("tr");

    row.innerHTML =
      "<td>" + name + "</td>" +
      "<td>" + email + "</td>" +
      "<td>" + contact + "</td>" +
      "<td>" + age + "</td>" +
      "<td>" +
        "<button class='editBtn'><i class='fa-solid fa-pen-to-square'></i></button> " +
        "<button class='delBtn'><i class='fa-solid fa-trash'></i></button>" +
      "</td>";

    tableBody.appendChild(row);

    row.querySelector(".delBtn").onclick = () => row.remove();

    row.querySelector(".editBtn").onclick = () => {
      nameInput.value = name;
      emailInput.value = email;
      contactInput.value = contact;
      ageInput.value = age;
      row.remove();
    };

    nameInput.value = "";
    emailInput.value = "";
    contactInput.value = "";
    ageInput.value = "";
  });
</script>

</body>
</html>
