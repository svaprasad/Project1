<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Country Explorer – Slide Panel</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:cursive;
}


body{
  height:100vh;
  /* display:flex; */
  align-items:center;
  justify-content:center;
  font-family:Arial, sans-serif;
  color:white;

  /* CSS-only animation */
  animation: bgChange 5s infinite alternate;
}

/* Smooth solid color transitions */
@keyframes bgChange {
  0%   { background:#1abc9c; }
  20%  { background:#3498db; }
  40%  { background:#9b59b6; }
  60%  { background:#e67e22; }
  80%  { background:#e74c3c; }
  100% { background:#2ecc71; }
}

/* HEADER */
header img{
  width: 10%;
  margin-top: 30px;
  margin-left: 20px;
}

/* MAIN */
.main{
  min-height:100vh;
  display:flex;
}


/* LEFT */
.left{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  /* padding-right: 100px; */
  margin-left: 100px;
}

.left h2{
  font-size: 65px;
  /* margin-bottom:10px; */
  color: olivedrab;
}

.left p{
  opacity:.8;
  margin-bottom:30px;
}

/* SEARCH */
.search-box{
  display:flex;
  gap:10px;
}

.search-box input{
  padding: 22px;
  width:320px;
  border-radius:8px;
  border:none;
  outline:none;
}

.search-box button{
  padding:16px 24px;
  border:none;
  border-radius:8px;
  background:#71f13e;
  color:#020202;
  font-weight:bold;
  cursor:pointer;
  transition:.2s;
  font-size: 25px;
}

.search-box button:hover{
  transform:translateY(-5px);
}

/* RIGHT PANEL */
.panel{
  width:380px;
  /* padding:25px; */
  margin-top: 50px;
}

.panel.show{
  transform:translateX(0);
}

.panel img{
  width:100%;
  border-radius:12px;
  margin-bottom:15px;
}

.panel p{
  margin:10px 0;
}

/* FOOTER */
footer{
  position:absolute;
  bottom:1px;
  left:50%;
  transform:translateX(-50%);
  font-size:.85rem;
  opacity:.7;
}
#countryInput{
  font-size: 18px;
  color: #000000;
}
</style>
</head>

<body>
  <header><img src="./oppty.png" alt="image show"></header>



<div class="main">
  <div class="left">
    <h2>Explore Countries</h2>
    <p>Search a country to view Information</p>

    <div class="search-box">
      <input type="text" id="countryInput" placeholder="Enter Country Name...">
      <button onclick="searchCountry()">Search</button>
    </div>
  </div>

  <div class="panel" id="panel"></div>
</div>


<footer>© 2026 Country Explorer</footer>

<script>
function searchCountry() {
  var name = countryInput.value.trim();
  if (!name) {
    alert("Enter country name");
    return;
  }

  fetch("https://restcountries.com/v3.1/name/" + name + "?fullText=true")
    .then(function (res) {
      if (!res.ok) {
        throw new Error("Not found");
      }
      return res.json();
    })
    .then(function (data) {
      var c = data[0];  

      var currency = c.currencies
        ? Object.values(c.currencies)[0].name
        : "N/A";

      var languages = c.languages
        ? Object.values(c.languages).join(", ")
        : "N/A";

      panel.innerHTML = `
        <img src="${c.flags.png}" alt="Flag">
        <p><b>Country:</b> ${c.name.common}</p>
        <p><b>Capital:</b> ${c.capital ? c.capital[0] : "N/A"}</p>
        <p><b>Population:</b> ${c.population.toLocaleString()}</p>
        <p><b>Currency:</b> ${currency}</p>
        <p><b>Languages:</b> ${languages}</p>
      `;

      panel.classList.add("show");
    })
    .catch(function () {
      alert("Country not found");
    });
}
</script>

</body>
</html>
